<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ASCII Art Generator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

  <header>
    <h1>ASCII Art Generator</h1>
    <p>Write your text, choose a style, then click Generate.</p>
  </header>

  <main>
    <form class="card" action="/ascii-art" method="POST">

      <label for="text">Your text</label>
      <textarea id="text" name="text" rows="4" maxlength="200" placeholder="Hello" required>{{.Text}}</textarea>
      <small>Maximum 200 characters.</small>

      {{if .Error}}
      <p class="error">{{.Error}}</p>
      {{end}}

      <p class="label">Style</p>
      <div class="styles">
        <label class="style">
          <input type="radio" name="style" value="standard" {{if eq .Style "standard"}}checked{{end}}>
          <span>Standard</span>
        </label>
        <label class="style">
          <input type="radio" name="style" value="shadow" {{if eq .Style "shadow"}}checked{{end}}>
          <span>Shadow</span>
        </label>
        <label class="style">
          <input type="radio" name="style" value="thinkertoy" {{if eq .Style "thinkertoy"}}checked{{end}}>
          <span>Thinkertoy</span>
        </label>
      </div>

      <button type="submit">Generate</button>
    </form>

    {{if .Result}}
    <section class="card">
      <p class="success">Done! Here is your text in the {{.Style}} style.</p>
      <pre class="art">{{.Result}}</pre>
    </section>
    {{end}}
  </main>

</body>
</html>
